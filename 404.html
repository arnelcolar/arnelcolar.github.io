<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Arnel Colar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23111'/><text x='16' y='21' font-family='Arial' font-weight='700' font-size='14' fill='%23fff' text-anchor='middle'>AC</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Absolute path: a 404 can be served at any depth, so a relative href would break. -->
<link rel="stylesheet" href="/assets/site.css">
<style>
  /* site.css only styles the nav links; the homepage defines this reset itself. */
  a{color:inherit;text-decoration:none}
  .nf{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(32px,6vw,64px);padding:clamp(64px,12vh,140px) 0 96px}
  .nf .code{font:600 clamp(64px,14vw,132px)/.85 Geologica,sans-serif;letter-spacing:-.05em;color:var(--ink);margin:0}
  .nf h1{font-size:clamp(24px,3.2vw,34px);font-weight:500;letter-spacing:-.03em;margin:0 0 12px}
  .nf p{color:var(--muted);max-width:52ch;margin:0 0 26px}
  .nf .routes{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px}
  .nf .routes a:not(.cta){font-size:14px;text-decoration:underline;text-underline-offset:3px}
  .nf .routes a:not(.cta)::after{content:"";position:absolute;inset:-14px 0}
  .nf .routes a:not(.cta){position:relative}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="name" href="/">Arnel Colar</a>
    <nav aria-label="Primary">
      <a class="back" href="/#work">Back to the work</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="nf">
    <p class="code" aria-hidden="true">404</p>
    <div>
      <p class="label">Page not found</p>
      <h1>That page isn't here.</h1>
      <p>The link may be old, or the page moved when the site changed. Everything I have is reachable from the homepage.</p>
      <div class="routes">
        <a class="cta" href="/">Go to the homepage</a>
        <a href="/#work">See the work</a>
        <a href="mailto:arnelcolar@gmail.com?subject=Project%20inquiry&amp;body=Page%20needed%3A%0ADeadline%3A%0ABudget%3A">Email me</a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="yr">2026</span> Arnel Colar</span>
    <span><a href="mailto:arnelcolar@gmail.com">arnelcolar@gmail.com</a></span>
  </div>
</footer>

<script>document.getElementById('yr').textContent = new Date().getFullYear()</script>
</body>
</html>
